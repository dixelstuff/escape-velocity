name: Publish Escape Velocity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check browser scoring against Python fixtures
        run: |
          node tests/test_progressive.mjs
          node tests/test_browser.mjs
          node tests/test_round_summary.mjs
          node tests/test_log.mjs
          node tests/test_map.mjs
          node tests/test_course_appearance.mjs
          node tests/test_shot_motion.mjs
          node tests/test_typing_layout.mjs
          node tests/test_word_taps.mjs
          node tests/test_chip_range.mjs
          node tests/test_startup.mjs
          node tests/test_new_discoveries.mjs
          node tests/test_course.mjs
          node tests/test_auto_finish.mjs
          node tests/test_plural_rescue.mjs
          node tests/test_word_families.mjs
          node tests/test_waypoint.mjs
          node tests/test_waypoint_assessment.mjs
          node tests/test_headwind.mjs
          node tests/test_word_model.mjs
          node tests/test_local_scaling.mjs
          node tests/test_daily_discoveries.mjs
          node tests/test_course_dialog.mjs
          node tests/test_tour_course.mjs
          node tests/test_competitive_course.mjs
          node tests/test_semantic_analysis.mjs
          node tests/test_semantic_journey.mjs
          node tests/test_cleverness.mjs
          node tests/test_cleverness_panel.mjs
          node tests/test_cleverness_worker.mjs
          node tests/test_semantic_panel.mjs
          node tests/test_rolling_course.mjs
          node tests/test_result_actions.mjs
          node tests/test_overlay_presentation.mjs
          node tests/test_bag_play.mjs
          node tests/test_stroke_play.mjs
          node tests/test_success_mode.mjs
          node tests/test_course_round.mjs
          node tests/test_practice_scorecard.mjs
          node tests/test_attempt_ghosts.mjs
          node tests/test_play_feedback.mjs
          node tests/test_hubs.mjs
          node tests/test_hub_warning.mjs
          node tests/test_skill.mjs
          node tests/test_skill_connections.mjs
          node tests/test_specificity.mjs
          node tests/test_route_review.mjs
          node tests/test_bridge_feedback.mjs
          node tests/test_skill_feedback.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - uses: actions/deploy-pages@v5
        id: deployment
